<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 256" width="100%" height="100%">
  <defs>
    <!-- Dynamic text gradient for the word "modes" to tie it into the branding -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9100" />
      <stop offset="100%" stop-color="#E040FB" />
    </linearGradient>
  </defs>

  <!-- Left Side: Icon Graphic (Scaled & isolated without box for elegant look) -->
  <g transform="translate(-60, -128) scale(1) " fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- Gradient Circle Emblem -->
    <circle cx="256" cy="256" r="90" fill="none" stroke="url(#textGrad)" stroke-width="8" opacity="0.4" />
    
    <!-- Minimalist House -->
    <path d="M 210,260 L 210,320 L 302,320 L 302,260" stroke="#FFFFFF" stroke-width="14" />
    <path d="M 180,265 L 256,190 L 332,265" stroke="#FFFFFF" stroke-width="14" />
    
    <!-- Clock Hands -->
    <path d="M 256,255 L 256,225" stroke="#FFFFFF" stroke-width="10" />
    <path d="M 256,255 L 280,268" stroke="#FFFFFF" stroke-width="10" />
    <circle cx="256" cy="255" r="6" fill="#FFFFFF" stroke="none" />
  </g>

  <!-- Right Side: Typography (Changed base fill to Home Assistant Blue #38BDF8) -->
  <text x="340" y="155" 
        fill="#38BDF8" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="82" 
        font-weight="800" 
        letter-spacing="-2px">Day <tspan fill="url(#textGrad)">modes</tspan></text>
        
  <!-- Subtitle / Description -->
  <text x="345" y="200" 
        fill="#9CA3AF" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="24" 
        font-weight="500" 
        letter-spacing="1px">TIME &amp; OCCUPANCY INTEGRATION</text>
</svg>
